name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify Production Target (Guard Against Staging Leaks)
        env:
          TARGET_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://gqpavuqopukyfeyqyrxc.supabase.co' }}
          PROD_REF: "gqpavuqopukyfeyqyrxc"
          STAGING_REF: "rhuwvnusbzdgoaarhbkr"
        run: |
          echo "Verificando se a URL de build aponta estritamente para PRODUÇÃO..."
          if [[ "$TARGET_URL" == *"$STAGING_REF"* ]]; then
            echo "::error::[FALHA DE SEGURANÇA] URL de homologação ($STAGING_REF) detectada no workflow de deploy de PRODUÇÃO!"
            exit 1
          fi
          if [[ "$TARGET_URL" != *"$PROD_REF"* ]]; then
            echo "::error::[FALHA DE SEGURANÇA] A URL de destino ($TARGET_URL) não pertence ao projeto de produção autorizado ($PROD_REF)!"
            exit 1
          fi
          echo "Validação concluída: O deploy para GitHub Pages está estritamente restrito a $PROD_REF."

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://gqpavuqopukyfeyqyrxc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_idoSyVhNDWy33hjn4xCUpw_wjpcB8CS' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
